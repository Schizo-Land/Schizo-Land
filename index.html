<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Update Selector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="main/assets/textures/SL-icon.png">
    <link rel="stylesheet" href="main/css/su.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Jersey+10&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main/css/undertale.css">
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #000000;
        color: #ffffff;
        margin: 0;
        min-height: 100vh;
      }
    </style>
</head>
<body>
  <main class="wrap" role="main">
    <h1 class="SU-title">Status Updates</h1>
    <p class="SU-text text-center">Actualizaciones disponibles de Schizo-Land</p>
    <ul>
        <a href="null" class="SUS-link text-center" style="text-decoration:none; margin-bottom:1rem; font-size:2rem; display:block;">
          Next Status Update
          <span class="text-center" style="font-size:1rem; display:block;">XX/XX/XX</span>
        </a>
        <a href="main/status-updates/2-02122025.html" class="SUS-link text-center" style="text-decoration:none; margin-bottom:1rem; font-size:2rem; display:block;">
          Status Update 2
          <span class="text-center" style="font-size:1rem; display:block;">02/12/2025</span>
        </a>
        <a href="main/status-updates/1-02072025.html" class="SUS-link text-center" style="text-decoration:none; margin-bottom:1rem; font-size:2rem; display:block;">
          Status Update 1
          <span class="text-center" style="font-size:1rem; display:block;">02/07/2025</span>
        </a>
    </ul>
  </main>

  <audio id="hover-sound" src="main/assets/sounds/snd_select.wav" preload="auto"></audio>
  <audio id="cantselect-sound" src="main/assets/sounds/snd_cantselect.wav" preload="auto"></audio>
  <script>
    const hoverSound = document.getElementById('hover-sound');
    const cantselectSound = document.getElementById('cantselect-sound');
    const isMobile = /Mobi|Android|iPhone|iPad|iPod|Windows Phone|Opera Mini/i.test(navigator.userAgent);

    document.querySelectorAll('.SUS-link').forEach(link => {
      link.addEventListener('mouseenter', () => {
        hoverSound.currentTime = 0;
        hoverSound.play().catch(() => {});
      });

      link.addEventListener('click', event => {
        const href = link.getAttribute('href');

        if (href === 'null') {
          event.preventDefault();
          cantselectSound.currentTime = 0;
          cantselectSound.play().catch(() => {});
          return;
        }

        if (isMobile) {
          event.preventDefault();
          hoverSound.currentTime = 0;
          hoverSound.play().catch(() => {});
          setTimeout(() => {
            window.location.href = link.href;
          }, 250);
        }
      });
    });
  </script>
</body>
</html>
