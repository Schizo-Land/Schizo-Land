<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Update Selector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="main/assets/textures/SL-icon.png">
    <link rel="stylesheet" href="/main/css/su.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Jersey+10&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/main/css/undertale.css">
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="wrap" role="main">
    <h1 class="SU-title">Status Updates</h1>
    <p class="SU-text text-center">Listado de actualizaciones de estado disponibles.</p>

    <ul>
      <li>
        <a href="main/status-updates/1-02072025.html" class="SUS-link SUS-link:hover">
          Status Update 1 — 02/07/2025
        </a>
      </li>

      <li>
        <a href="main/status-updates/2-02122025.html" class="SUS-link SUS-link:hover">
          Status Update 2 — 02/12/2025  
        </a>
      </li>
    </ul>

    <p style="margin-top:1.5rem;color:var(--muted);font-size:0.9rem;">
      Para añadir más entradas, copia uno de los <code>&lt;li&gt;</code> anteriores y actualiza el href y el texto.
    </p>
  </main>

  <audio id="hover-sound" src="main/assets/sounds/snd_select.wav" preload="auto"></audio>
  <script>
    const hoverSound = document.getElementById('hover-sound');
    document.querySelectorAll('.SUS-link').forEach(link => {
      link.addEventListener('mouseenter', () => {
        hoverSound.currentTime = 0;
        hoverSound.play().catch(() => {});
      });
    });
  </script>
</body>
</html>
